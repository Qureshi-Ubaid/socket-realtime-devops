apiVersion: apps/v1
kind: Deployment
metadata:
  name: socket-app-deployment
  labels:
    app: socket-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: socket-app
  template:
    metadata:
      labels:
        app: socket-app
    spec:
      containers:
      - name: socket-app
        image: ubaidqureshi92/socket-realtime-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000