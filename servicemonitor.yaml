apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: socket-app-monitor
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: socket-app
  namespaceSelector:
    matchNames:
      - default
  endpoints:
  - port: http
    path: /metrics
    interval: 15s